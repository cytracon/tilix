name: Release Cytracon Package

# Tag push e.g. v1.9.8-cytracon.10 → build + GitHub Release with tarball
on:
  push:
    tags:
      - 'v*-cytracon.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq --no-install-recommends \
            libgtk-3-dev libvte-2.91-dev libsecret-1-dev \
            libgtksourceview-3.0-dev librsvg2-dev \
            libglib2.0-dev libpango1.0-dev libcairo2-dev \
            libatk1.0-dev libpeas-dev \
            desktop-file-utils gettext file

      - name: Install LDC
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Build release binary
        run: |
          dub build --compiler=ldc2 --build=release
          file ./tilix
          # headless: do not run GUI binary without display
          strings ./tilix | grep -oE '1\.[0-9.]+-cytracon\.[0-9]+' | head -1

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          # stream logs to stderr; only final path on stdout for capture
          TAR="$(PKG_DIR="$PWD" TILIX_BIN="$PWD/tilix" ./scripts/package-tilix.sh 2> >(tee /dev/stderr) | tail -1)"
          # package-tilix is a thin wrapper; if empty, use latest.pkgpath
          if [[ -z "${TAR}" || ! -f "${TAR}" ]]; then
            if [[ -f "${PWD}/tilix-cytracon-latest.pkgpath" ]]; then
              TAR="$(cat "${PWD}/tilix-cytracon-latest.pkgpath")"
            else
              TAR="$(ls -1t "${PWD}"/tilix-cytracon-*-linux-x86_64.tar.gz 2>/dev/null | head -1 || true)"
            fi
          fi
          [[ -n "${TAR}" && -f "${TAR}" ]] || { echo "Package failed"; exit 1; }
          VERSION="$(strings ./tilix | grep -oE '1\.[0-9.]+-cytracon\.[0-9]+' | head -1 || true)"
          VERSION="${VERSION:-${GITHUB_REF_NAME#v}}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tar=$(basename "$TAR")" >> "$GITHUB_OUTPUT"
          ls -lh "$TAR"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tilix ${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.pkg.outputs.tar }}
          body: |
            ## Cytracon Tilix ${{ steps.pkg.outputs.version }}

            ### Install / update (any machine)
            ```bash
            # public repo — no token required
            ./scripts/tilix-update.sh
            # or after install:  tilix-update
            tilix-update --install-timer   # optional daily update
            ```

            Installs into `~/.local` (no root). Then fully quit Tilix and start again.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
